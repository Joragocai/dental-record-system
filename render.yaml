# Phase 11 staging Express API only. The React frontend deploys separately on Vercel.
# This Blueprint never provisions a Render PostgreSQL database or runs migrations.
services:
  - type: web
    name: dental-record-staging-api
    runtime: node
    plan: free
    branch: refactor/v2-cloud-migration
    buildCommand: npm ci
    startCommand: npm run start:hosted
    # Render platform health should verify the process, not restart a healthy
    # API because an external database has a temporary outage. Phase 11 still
    # validates PostgreSQL/schema explicitly through /api/ready after deploy.
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DENTAL_SERVER_ENV
        value: staging
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_SSL_CA_FILE
        value: /etc/secrets/dental-staging-ca.crt
      - key: ALLOW_PRODUCTION_DB_COMMANDS
        value: 'false'
      - key: SUPABASE_ATTACHMENT_BUCKET
        value: dental-attachments-staging
      - key: NODE_VERSION
        value: '24'
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STAFF_INVITE_REDIRECT_URL
        sync: false
